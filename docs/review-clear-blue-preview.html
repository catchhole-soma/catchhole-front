  <header><small>CATCHHOLE · GH215</small><h1>Clear Blue로 바꾼 후보 검토 화면</h1>
    <p>실제 React 컴포넌트의 캡처입니다. 검토 화면과 함께 랜딩, 공개 체험, 첫 업로드 안내를 같은 디자인으로 맞췄습니다. 원래 시안과 팀 공유 문서는 그대로 보존했습니다.</p>
    <p>사진을 누르면 원래 크기로 볼 수 있습니다. <a href="review-clear-blue.md">43개 상태 대응표와 검증 내역</a> · <a href="https://github.com/catchhole-soma/catchhole-backend-java/issues/215">작업 이슈</a></p>
  </header>
  <div class="grid">

    <figure><figcaption><strong>확정 전에는 언제든 다시 선택</strong><span>후속 수정 · 목 API와 실제 컴포넌트 · 저장·새로고침 뒤에도 포함/별도 선택 유지, 비교 본문 높이 정렬</span></figcaption><a href="screens/gh215/world-reselect-before-confirm.png"><img src="screens/gh215/world-reselect-before-confirm.png" alt="초안을 저장한 뒤에도 포함과 별도 저장 선택지를 유지한 세계관 검토"></a></figure>

    <figure><figcaption><strong>랜딩의 세계관 검토 예시</strong><span>신규 설정은 새 내용만 표시 · 기존값 없음 칸 제거</span></figcaption><a href="screens/gh215/landing-world-1280.png"><img loading="lazy" src="screens/gh215/landing-world-1280.png" alt="랜딩에서 보여 주는 새 세계관 검토 화면"></a></figure>
    <figure><figcaption><strong>로그인 없이 체험하기</strong><span>공통 컴포넌트로 바뀐 캐릭터 비교 · 체험 상태는 메모리에만 유지</span></figcaption><a href="screens/gh215/demo-character-1280.png"><img loading="lazy" src="screens/gh215/demo-character-1280.png" alt="공개 체험의 실제 변경 전후 비교와 반영 방식 선택"></a></figure>
