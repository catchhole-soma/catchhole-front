name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:layout
      - run: npm run test:setting-evidence

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify explicit relationship workspace disable
        run: npm run test:e2e -- e2e/relationship-feature-off.spec.ts --workers=2
        env:
          VITE_RELATIONSHIP_WORKSPACE_ENABLED: 'false'
          CATCHHOLE_E2E_PORT: '3107'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
